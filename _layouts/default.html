<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{% if page.title and page.url != "/" %}{{ page.title }} · Inkover{% else %}Inkover{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:image" content="{{ '/assets/icon.png' | relative_url }}">
    <meta name="theme-color" content="#1c1c1e">
    <link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ '/assets/icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
    <header class="top">
        <a class="brand" href="{{ '/' | relative_url }}">
            <img src="{{ '/assets/icon.png' | relative_url }}" width="32" height="32" alt="">
            <span>Inkover</span>
        </a>
        <nav>
            <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>Overview</a>
            <a href="{{ '/support' | relative_url }}"{% if page.url contains "/support" %} aria-current="page"{% endif %}>Support</a>
            <a href="{{ '/docs/privacy' | relative_url }}"{% if page.url contains "/privacy" %} aria-current="page"{% endif %}>Privacy</a>
            <a href="https://github.com/vinaySankar2004/inkover">Source</a>
        </nav>
    </header>
    <main class="{{ page.class | default: 'doc' }}">
{{ content }}
    </main>
    <footer>
        <p>Inkover is open source under the MIT licence. It requires an iPad and an Apple Pencil.</p>
        <p><a href="{{ '/docs/privacy' | relative_url }}">Privacy</a> · <a href="{{ '/support' | relative_url }}">Support</a> · <a href="https://github.com/vinaySankar2004/inkover">GitHub</a></p>
    </footer>
</body>
</html>
